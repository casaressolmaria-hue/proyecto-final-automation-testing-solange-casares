[pytest]
addopts = -v -s --html=reports/report.html --self-contained-html
html_report_title = TalentoLab - Resumen de ejecución
html_report_description = Suite UI + API completa
markers =
    api: Tests de API.
    ui: Tests de UI.
    smoke: Tests críticos que deben funcionar siempre.
    regresion: Suite completa de regresión.
    carrito: Tests relacionados con el carrito de compras.
    catalogo: Tests del catálogo.
    login: Tests del flujo de inicio de sesión.
    e2e: Tests end-to-end que verifican flujos completos de la API.
testpaths = tests tests_api
python_files = test_*.py
python_functions = test_*
